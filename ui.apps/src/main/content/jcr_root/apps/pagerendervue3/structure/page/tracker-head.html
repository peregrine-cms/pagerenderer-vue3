<!--/*
    Head extension point.

    Empty by default. A theme overrides this file in its own page component
    (which sets sling:resourceSuperType to pagerendervue3/structure/page) to add
    anything that must live in <head>: favicons, verification meta tags,
    analytics snippets, extra preloads.

    The Vue 2 renderer had the same hook and themes rely on it, so it is kept
    here under the same name.

    NOTE for overrides: data-sly-use locals do NOT propagate into a
    data-sly-include, so an override that needs the Helper must re-declare it
    with its own data-sly-use.
*/-->
